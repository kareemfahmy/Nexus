name: CI and deploy

# Every push and pull request is tested and built.
# Pushes to the default branch are also deployed to GitHub Pages.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests (Vitest)
        run: npx ng test --watch=false

      - name: Design-token check (no raw colours/sizes in components)
        run: node .claude/skills/design-system/scripts/validate-tokens.cjs --dir src/app

      - name: Production build
        # The site is served from https://<user>.github.io/<repo>/, so assets resolve under /<repo>/
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - name: SPA fallback for deep links
        # GitHub Pages has no rewrite rules; serving index.html as 404.html lets the Angular
        # router handle URLs like /Nexus/sites/123 on refresh or when shared.
        run: cp dist/nexus/browser/index.html dist/nexus/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/nexus/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
